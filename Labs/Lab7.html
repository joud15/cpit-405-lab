
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Unsplash API</title>

    <style>
        body {
            margin: 0;
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px;
            background-color: #f1f1f1;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 14px;
            margin: 0 10px 0 0;
        }

        input {
            padding: 7px;
            width: 180px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            padding: 7px 10px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        #message {
            text-align: center;
            margin: 15px;
            color: #555;
        }

        #searchResults {
            max-width: 880px;
            margin: 12px auto;
            padding: 0 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .photo-card {
            position: relative;
            height: 370px;
            overflow: hidden;
            border-radius: 5px;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .credit {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0;
            padding: 8px;
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            font-size: 11px;
        }

        .credit a {
            color: white;
        }

        @media (max-width: 700px) {
            #searchResults {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            #searchResults {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Unsplash API</h1>

        <input type="text" id="searchText"
               value="Makkah" placeholder="Search photos">

        <button id="xhrSearch">Search using XHR</button>

        <button id="fetchSearch">
            Search using fetch (promises)
        </button>

        <button id="fetchAsyncAwaitSearch">
            Search using fetch (async/await)
        </button>
    </header>

    <p id="message" aria-live="polite"></p>
    <div id="searchResults"></div>

    <script>

        // Access Key from Unsplash Developers
        const accessKey = "ptfpcIH6UXbisXyp4BCHb6ynGV1wjBifEbYNXBDrbzY";

        let searchText = document.getElementById("searchText");
        let searchResults = document.getElementById("searchResults");
        let message = document.getElementById("message");

        let btnXHR = document.getElementById("xhrSearch");
        let btnFetch = document.getElementById("fetchSearch");
        let btnAsyncAwait = document.getElementById("fetchAsyncAwaitSearch");


        // Create API URL
        function getURL() {
            return "https://api.unsplash.com/search/photos?query=" +
                encodeURIComponent(searchText.value) +
                "&per_page=8&orientation=portrait";
        }


        // Prepare for searching
        function prepareSearch() {

            searchResults.innerHTML = "";

            if (!searchText.value) {
                message.innerText = "Please enter a search keyword.";
                return false;
            }

            if (accessKey === "PASTE_YOUR_ACCESS_KEY_HERE") {
                message.innerText = "Please add your Unsplash Access Key.";
                return false;
            }

            message.innerText = "Loading photos...";
            return true;
        }


        // Display images using DOM
        function showPhotos(photos) {

            searchResults.innerHTML = "";
            message.innerText = "";

            if (photos.length === 0) {
                message.innerText = "No photos found.";
                return;
            }

            for (let i = 0; i < photos.length; i++) {

                let card = document.createElement("div");
                card.className = "photo-card";

                let image = document.createElement("img");
                image.src = photos[i].urls.small;
                image.alt = photos[i].alt_description || searchText.value;

                card.appendChild(image);

                let credit = document.createElement("p");
                credit.className = "credit";
                credit.innerText = "Photo by ";

                let photographer = document.createElement("a");

                photographer.href =
                    photos[i].user.links.html +
                    "?utm_source=cpit405_lab7&utm_medium=referral";

                photographer.innerText = photos[i].user.name;
                photographer.target = "_blank";

                credit.appendChild(photographer);

                credit.appendChild(
                    document.createTextNode(" on ")
                );

                let unsplash = document.createElement("a");

                unsplash.href =
                    "https://unsplash.com/?utm_source=cpit405_lab7&utm_medium=referral";

                unsplash.innerText = "Unsplash";
                unsplash.target = "_blank";

                credit.appendChild(unsplash);

                card.appendChild(credit);
                searchResults.appendChild(card);
            }
        }


        // Method 1: XMLHttpRequest
        function searchUsingXHR() {

            if (!prepareSearch()) return;

            let xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {

                if (xhr.readyState != 4) return;

                if (xhr.status === 200) {

                    let data = JSON.parse(xhr.responseText);
                    showPhotos(data.results);

                } else {

                    message.innerText =
                        "Unable to load photos. Check the API response or your Access Key.";
                }
            };

            xhr.open("GET", getURL(), true);

            xhr.setRequestHeader(
                "Authorization",
                "Client-ID " + accessKey
            );

            xhr.send();
        }


        // Method 2: Fetch with Promises
        function searchUsingFetch() {

            if (!prepareSearch()) return;

            fetch(getURL(), {
                headers: {
                    "Authorization": "Client-ID " + accessKey
                }
            })

            .then(function(response) {

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                return response.json();
            })

            .then(function(data) {
                showPhotos(data.results);
            })

            .catch(function(error) {

                message.innerText =
                    "Unable to load photos. Check the API response or your Access Key.";

                console.error(error);
            });
        }


        // Method 3: Fetch with Async/Await
        async function searchUsingAsyncAwait() {

            if (!prepareSearch()) return;

            try {

                let response = await fetch(getURL(), {
                    headers: {
                        "Authorization": "Client-ID " + accessKey
                    }
                });

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                let data = await response.json();

                showPhotos(data.results);

            } catch (error) {

                message.innerText =
                    "Unable to load photos. Check the API response or your Access Key.";

                console.error(error);
            }
        }


        // Mouse Events
        btnXHR.addEventListener("click", searchUsingXHR);

        btnFetch.addEventListener("click", searchUsingFetch);

        btnAsyncAwait.addEventListener(
            "click",
            searchUsingAsyncAwait
        );


        // Keyboard Event
        searchText.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                searchUsingXHR();
            }

        });


        // Load Makkah photos when the page opens
        searchUsingXHR();

    </script>

</body>
</html>
